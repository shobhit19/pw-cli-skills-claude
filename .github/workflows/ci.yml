name: PR Test Pipeline

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build (compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  ui-tests:
    name: UI Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:ui

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: playwright-report/
          retention-days: 7

  api-tests:
    name: API Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 7

  tests-gate:
    name: Tests Gate (UI or API)
    # Runs after both suites regardless of whether they passed (`if: always()`),
    # then passes as long as at least ONE of them succeeded. ui-tests/api-tests
    # still show their own individual pass/fail for visibility, but this job
    # (together with build) is the one branch protection should require —
    # see .github/workflows/README.md.
    needs: [ui-tests, api-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one test suite to have passed
        run: |
          echo "UI Tests result:  ${{ needs.ui-tests.result }}"
          echo "API Tests result: ${{ needs.api-tests.result }}"
          if [ "${{ needs.ui-tests.result }}" = "success" ] || [ "${{ needs.api-tests.result }}" = "success" ]; then
            echo "At least one test suite passed."
            exit 0
          fi
          echo "Both UI Tests and API Tests failed."
          exit 1
